# ---------------- Postdocs ----------------

- name: Dra. Ana Clara Sampaio Pimenta
  category: postdoc
  photo: ""
  role:
    en: Postdoctoral researcher · CEPOF
    pt: Pós-doutoranda · CEPOF
  bio:
    en: >-
      Postdoc at CEPOF/IFSC-USP since 2023, previously a postdoc at UFMG. Experienced in
      Raman, photoluminescence and second-harmonic generation spectroscopy, GaAs nanowires
      and microcavities, and 2D materials on plasmonic nanostructures.
    pt: >-
      Pós-doutoranda no CEPOF/IFSC-USP desde 2023, anteriormente pós-doutoranda na UFMG.
      Experiência em espectroscopia Raman, fotoluminescência e geração de segundo harmônico,
      nanofios e microcavidades de GaAs, e materiais 2D sobre nanoestruturas plasmônicas.
