# ---------------- Faculty / collaborating professors ----------------

- name: Prof. Dr. Victor Anthony Garcia Rivera
  category: researcher
  photo: ""
  role:
    en: Professor · UNESP
    pt: Professor · UNESP
  bio:
    en: >-
      Physicist working on photonics, tellurite and germanate glasses, optical
      spectroscopy, metallic nanoparticles and plasmonics. PhD from the Federal
      University of São Carlos (2009) and MSc from UNICAMP (2005). He was a research
      professional at COPL, Université Laval (Canada), and a FAPESP Young Researcher at IFSC-USP.
    pt: >-
      Físico com atuação em fotônica, vidros teluritos e germanatos, espectroscopia
      óptica, nanopartículas metálicas e plasmônica. Doutor pela Universidade Federal
      de São Carlos (2009) e mestre pela UNICAMP (2005). Foi pesquisador no COPL,
      Université Laval (Canadá), e Jovem Pesquisador FAPESP no IFSC-USP.
  email: ""
  lattes: http://lattes.cnpq.br/4335695906660499
  orcid: https://orcid.org/0000-0002-2312-970X
  scholar: https://scholar.google.com/citations?user=9UEJUQ0AAAAJ
  linkedin: ""

