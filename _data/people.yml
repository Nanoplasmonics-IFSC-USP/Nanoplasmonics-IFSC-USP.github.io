# ---------------- Principal Investigator ----------------

- name: Prof. Dr. Euclydes Marega Junior
  category: pi
  photo: ""
  role:
    en: Professor · IFSC-USP
    pt: Professor · IFSC-USP
  bio:
    en: >-
      Professor at the São Carlos Institute of Physics (IFSC-USP) and member of the
      Optics and Photonics Research Center (CEPOF). His research covers nanophotonics,
      plasmonics, semiconductors and quantum dots, with more than 180 publications.
      He has also been a visiting professor at the University of Electronic Science
      and Technology of China (UESTC) since 2015.
    pt: >-
      Professor do Instituto de Física de São Carlos (IFSC-USP) e membro do
      Centro de Pesquisa em Óptica e Fotônica (CEPOF). Atua em nanofotônica,
      plasmônica, semicondutores e pontos quânticos, com mais de 180 publicações.
      É também professor visitante da University of Electronic Science and
      Technology of China (UESTC) desde 2015.
