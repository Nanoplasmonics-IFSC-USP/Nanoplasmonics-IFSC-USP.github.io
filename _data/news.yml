- date: 2026-10-01
  precision: month
  category: publication
  image: /assets/img/research/rare-earth-glasses.svg
  title:
    en: Three new papers on rare-earth-doped tellurite glasses
    pt: Três novos artigos sobre vidros teluritos dopados com terras-raras
  text:
    en: |
      Three papers published this month extend our work on tellurite-based glasses:

      - [Green light tuning by up-conversion emission in Er³⁺-doped tellurite glasses for enhanced light-emitting devices](https://doi.org/10.1016/j.optmat.2026.118208) — *Optical Materials*
      - [Multicolor emission tuning in Yb³⁺/Tm³⁺/Er³⁺ triply doped germanate-tellurite glasses](https://doi.org/10.1016/j.jnoncrysol.2026.124302) — *Journal of Non-Crystalline Solids*
      - [Structural engineering and optical nonlinearities based on Nb₂O₅ effects in tellurite-zinc-lanthanum glasses](https://doi.org/10.1016/j.jallcom.2026.191394) — *Journal of Alloys and Compounds*
    pt: |
      Três artigos publicados neste mês ampliam nosso trabalho com vidros teluritos:

      - [Green light tuning by up-conversion emission in Er³⁺-doped tellurite glasses for enhanced light-emitting devices](https://doi.org/10.1016/j.optmat.2026.118208) — *Optical Materials*
      - [Multicolor emission tuning in Yb³⁺/Tm³⁺/Er³⁺ triply doped germanate-tellurite glasses](https://doi.org/10.1016/j.jnoncrysol.2026.124302) — *Journal of Non-Crystalline Solids*
      - [Structural engineering and optical nonlinearities based on Nb₂O₅ effects in tellurite-zinc-lanthanum glasses](https://doi.org/10.1016/j.jallcom.2026.191394) — *Journal of Alloys and Compounds*

