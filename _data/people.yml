# Group members. The People page groups them by category, in this order:
#   pi, researcher, postdoc, phd, msc, undergrad, exchange, staff, alumni
# Within each category people are listed alphabetically (titles ignored), so order here doesn't matter.
#
# Fields (only name and category are required):
#   photo:   /assets/img/people/<file>.jpg   (square photos look best; leave "" for a placeholder)
#   role:    en/pt text under the name
#   bio:     en/pt short text (Markdown allowed)
#   email, lattes, orcid, scholar, linkedin, website: links (leave "" to hide)
#   level:   alumni only — postdoc, phd, msc or undergrad (highest level done in the group)
#   now:     alumni only — current position (en/pt)
#   thesis:  alumni only — link to the thesis/dissertation (USP digital library)

# ---------------- Principal Investigator ----------------

- name: Prof. Dr. Euclydes Marega Junior
  category: pi
  photo: /assets/img/people/euclydes.jpg
  role:
    en: Full Professor · IFSC-USP
    pt: Professor Titular · IFSC-USP
  bio:
    en: >-
      Full Professor at IFSC-USP, CNPq Research Productivity Fellow (level 1B) and Visiting Professor at the Institute of Fundamental and Frontier Sciences (UESTC, China). BSc (1988) and PhD (1993) in Physics from USP, with postdocs at IFSC-USP and the University of Arkansas (2004–2005), where he was also a Visiting Professor.


      His research focuses on nanophotonics and plasmonics: strong light–matter coupling, plasmon-induced doping and strain in transition-metal dichalcogenide monolayers (such as MoS₂) on metasurfaces and metallic nanostructures, in collaboration with EPFL; InAs/GaAs quantum dots integrated into photonic cavities as single-photon sources for quantum information; luminescence, infrared emission and optical thermometry in Er³⁺/Yb³⁺-doped tellurite and germanate glasses and thin films with metallic nanoparticles; and the growth of III–V and SiGeSn semiconductors, in long-standing cooperation with the Institute of Nanoscale Science and Engineering (University of Arkansas).


      Principal Investigator and Outreach Coordinator at the Optics and Photonics Research Center (CEPOF/FAPESP) and member of the SISFOTON-USP and SISNANO-USP networks. He conceived the competition that became the Brazilian Physics Olympiad (OBF), served as its national coordinator, and co-founded the Brazilian Physics Olympiad for Public Schools (OBFEP).
    pt: >-
      Professor Titular do IFSC-USP, bolsista de Produtividade em Pesquisa do CNPq (nível 1B) e Professor Visitante no Institute of Fundamental and Frontier Sciences (UESTC, China). Graduado (1988) e doutor (1993) em Física pela USP, com pós-doutorados no IFSC-USP e na University of Arkansas (2004–2005), onde também atuou como Professor Visitante.


      Sua pesquisa é voltada à nanofotônica e à plasmônica: acoplamento forte luz–matéria, dopagem induzida por plasmons e efeitos de deformação em monocamadas de dicalcogenetos de metais de transição (como MoS₂) sobre metassuperfícies e nanoestruturas metálicas, em colaboração com a EPFL; pontos quânticos InAs/GaAs integrados a cavidades fotônicas como fontes de fótons únicos para informação quântica; luminescência, emissão no infravermelho e termometria óptica em vidros e filmes finos teluritos e germanatos dopados com Er³⁺/Yb³⁺ e nanopartículas metálicas; e o crescimento de semicondutores III–V e SiGeSn, em cooperação de longa data com o Institute of Nanoscale Science and Engineering (University of Arkansas).


      Pesquisador Principal e Coordenador de Difusão do Centro de Pesquisa em Óptica e Fotônica (CEPOF/FAPESP) e membro das redes SISFOTON-USP e SISNANO-USP. Idealizou a competição que deu origem à Olimpíada Brasileira de Física (OBF), da qual foi Coordenador Nacional, e cofundou a Olimpíada Brasileira de Física das Escolas Públicas (OBFEP).
  email: euclydes@ifsc.usp.br
  lattes: http://lattes.cnpq.br/1410215769571368
  orcid: https://orcid.org/0000-0002-3334-4630
  scholar: https://scholar.google.com/citations?user=DogZ64IAAAAJ
  linkedin: https://www.linkedin.com/in/euclydes-marega-junior-84077013/

# ---------------- Faculty / collaborating professors ----------------

- name: Prof. Dr. Victor Anthony Garcia Rivera
  category: researcher
  photo: /assets/img/people/victor.jpg
  role:
    en: Professor · UNESP Rio Claro
    pt: Professor · UNESP Rio Claro
  bio:
    en: >-
      Professor at the Department of Physics, IGCE-UNESP (Rio Claro), since 2026. BSc in Physics from the Universidad Nacional Federico Villarreal (Peru), MSc from UNICAMP and PhD from UFSCar; postdocs at IFSC-USP and researcher at COPL, Université Laval (Canada). Former professor and graduate program director at UNMSM (Peru) and head of CONCYTEC's National Program for Basic Sciences. Works on photonic glasses, optical fibers, lasers, optical spectroscopy and plasmonics for telecommunications and sensing; author of over 87 papers and 2 Springer books.
    pt: >-
      Professor do Departamento de Física do IGCE-UNESP (Rio Claro) desde 2026. Graduado em Física pela Universidad Nacional Federico Villarreal (Peru), mestre pela UNICAMP e doutor pela UFSCar; pós-doutorados no IFSC-USP e pesquisador no COPL, Université Laval (Canadá). Foi professor e diretor de pós-graduação na UNMSM (Peru) e responsável pelo Programa Nacional de Ciências Básicas do CONCYTEC. Atua em vidros fotônicos, fibras ópticas, lasers, espectroscopia óptica e plasmônica para telecomunicações e sensoriamento; autor de mais de 87 artigos e 2 livros pela Springer.
