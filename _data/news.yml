- date: 2023-07-27
  category: defense
  image: /assets/img/research/2d-materials.svg
  title:
    en: Two master's defenses in the group
    pt: Duas defesas de mestrado no grupo
  text:
    en: |
      Matheus Lemes ([*Study of light-matter interaction in single-layer molybdenum disulfide coupled to gold structures*](https://www.teses.usp.br/teses/disponiveis/76/76134/tde-31082023-111042/), July 24) and José Chacaliaza Ricaldi ([*Thin films based on Er³⁺ doped germanate-tellurite nanoglasses for Plasmonics*](https://www.teses.usp.br/teses/disponiveis/76/76134/tde-18082023-093815/), July 27) defended their MSc dissertations. Both continue in the group as PhD students.
    pt: |
      Matheus Lemes ([*Study of light-matter interaction in single-layer molybdenum disulfide coupled to gold structures*](https://www.teses.usp.br/teses/disponiveis/76/76134/tde-31082023-111042/), 24 de julho) e José Chacaliaza Ricaldi ([*Thin films based on Er³⁺ doped germanate-tellurite nanoglasses for Plasmonics*](https://www.teses.usp.br/teses/disponiveis/76/76134/tde-18082023-093815/), 27 de julho) defenderam suas dissertações de mestrado. Ambos seguem no grupo como doutorandos.
