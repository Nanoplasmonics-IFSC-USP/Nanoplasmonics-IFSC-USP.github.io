  home:
    eyebrow: Instituto de Física de São Carlos · USP
    hero_title: Luz em nanoescala
    hero_subtitle: Exploramos a interação luz–matéria em escala nanométrica, na interface entre fotônica, óptica quântica, eletromagnetismo e física do estado sólido.
    cta_research: Nossa pesquisa
    cta_join: Faça parte do grupo
    about_title: Sobre o grupo
    about: |
      Somos um grupo de pesquisa em **Nanofotônica Quântica** que atua na interface entre fotônica,
      óptica quântica, eletromagnetismo e física do estado sólido. Nosso trabalho busca compreender e
      explorar fenômenos fundamentais de interação luz–matéria em escala nanométrica, combinando abordagens
      experimentais, teóricas e computacionais, desde a fabricação e caracterização de materiais e
      nanoestruturas até a modelagem e simulação de sistemas fotônicos.

      O grupo integra fabricação, experimentação, teoria, simulação eletromagnética e modelagem
      computacional, buscando desenvolver novos materiais, estruturas e metodologias para o controle da luz
      e para aplicações em nanofotônica, fotônica integrada e tecnologias quânticas.
