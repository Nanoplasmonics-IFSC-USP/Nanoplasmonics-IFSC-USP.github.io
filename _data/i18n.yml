  home:
    eyebrow: São Carlos Institute of Physics · USP
    hero_title: Light at the nanoscale
    hero_subtitle: We explore light–matter interaction at the nanoscale, at the interface of photonics, quantum optics, electromagnetism and solid-state physics.
    cta_research: Our research
    cta_join: Join the group
    about_title: About the group
    about: |
      We are a research group in **Quantum Nanophotonics**, working at the interface of photonics,
      quantum optics, electromagnetism and solid-state physics. Our work seeks to understand and exploit
      fundamental light–matter interaction phenomena at the nanoscale, combining experimental, theoretical
      and computational approaches: from the fabrication and characterization of materials and
      nanostructures to the modeling and simulation of photonic systems.

      The group integrates fabrication, experiments, theory, electromagnetic simulation and computational
      modeling to develop new materials, structures and methods for controlling light, with applications
      in nanophotonics, integrated photonics and quantum technologies.
