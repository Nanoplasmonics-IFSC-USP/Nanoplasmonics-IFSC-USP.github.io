<svg class="plasmon" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="np-gold" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.3" stop-color="#f4c552"/>
      <stop offset="0.75" stop-color="#b8741c"/>
      <stop offset="1" stop-color="#5e360a"/>
    </radialGradient>
    <radialGradient id="np-lobe" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3f25a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8fa100" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#487237" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="np-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.3" stop-color="#f4c552" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4c552" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="plasmon-rings" fill="none" stroke="#b5cc1f" stroke-opacity="0.22">
    <circle cx="200" cy="200" r="100" stroke-dasharray="2 6"/>
    <circle cx="200" cy="200" r="135" stroke-dasharray="1 9"/>
    <circle cx="200" cy="200" r="170" stroke-dasharray="2 12"/>
  </g>

  <path class="plasmon-wave" fill="none" stroke="#7fc79a" stroke-width="2" stroke-linecap="round"
        d="M200 -40 q30 17.5 0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35 t0 35"/>

  <ellipse class="plasmon-lobe plasmon-lobe-l" cx="118" cy="200" rx="78" ry="58" fill="url(#np-lobe)"/>
  <ellipse class="plasmon-lobe plasmon-lobe-r" cx="282" cy="200" rx="78" ry="58" fill="url(#np-lobe)"/>

  <circle cx="200" cy="200" r="95" fill="url(#np-halo)"/>
  <circle cx="200" cy="200" r="60" fill="url(#np-gold)"/>

  <g class="plasmon-charges" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#5e360a" fill-opacity="0.75">
    <text x="160" y="208">−</text>
    <text x="240" y="208">+</text>
  </g>
</svg>
