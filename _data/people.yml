  orcid: https://orcid.org/0000-0002-2312-970X
  scholar: https://scholar.google.com/citations?user=9UEJUQ0AAAAJ
  linkedin: https://www.linkedin.com/in/victor-anthony-garcia-rivera-v-a-g-rivera-a09b75103/

