- date: 2026-05-13
  category: publication
  venue: "Springer Nature"
  link: https://doi.org/10.1007/978-3-032-18501-3
  link_label: more
  title:
    en: "New book by Springer Nature: A Brief Guide to Optical Spectroscopy of Trivalent Rare Earth Ions in Glasses"
    pt: "Novo livro pela Springer Nature: A Brief Guide to Optical Spectroscopy of Trivalent Rare Earth Ions in Glasses"
  text:
    en: Written by group members and collaborators (G. Lozano C., J. Chacaliaza-Ricaldi, J. dos Santos, E. Marega Jr., Y. Messaddeq and V. Rivera), the book is a practical guide to the optical spectroscopy of rare-earth ions in glasses.
    pt: Escrito por membros e colaboradores do grupo (G. Lozano C., J. Chacaliaza-Ricaldi, J. dos Santos, E. Marega Jr., Y. Messaddeq e V. Rivera), o livro é um guia prático de espectroscopia óptica de íons terras-raras em vidros.

